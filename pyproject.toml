[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk"
version = "0.1.0"
description = "HelpDesk - Ticket Management System (Design Patterns course project)"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
helpdesk = "helpdesk.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
